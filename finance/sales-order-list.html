<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Sales Order · ETrama Finance</title>
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">
  <!-- ASUMSI: daftar SO menonjolkan client & progres penagihan; detail angka (ToP, no. dokumen klien, nominal penuh) ada di halaman detail SO. -->
  <main id="page-content" class="space-y-6">
    <div id="kpi" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-4"></div>
    <div id="table"></div>
  </main>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/domain.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Layout.init({ portal: 'finance', active: 'sales-order-list', title: 'Daftar Sales Order', breadcrumb: ['Finance', 'Sales Order'], perm: 'so' });
    const { esc, formatRupiah: rp, formatRupiahShort: rpS, icon } = UI;
    const money = (v, cls) => `<span class="num ${cls || ''}" title="${rp(v)}">${rpS(v)}</span>`;

    // Status tiap termin: lunas / terkirim / dalam proses (draft–disetujui) / belum ditagih.
    const TERM = {
      paid: { cls: 'bg-[#1FC16B]', label: 'Lunas' },
      sent: { cls: 'bg-brand-blue', label: 'Terkirim' },
      process: { cls: 'bg-[#93B4F5]', label: 'Invoice dalam proses' },
      none: { cls: 'bg-slate-200', label: 'Belum ditagih' },
    };
    function termStates(so) {
      const invs = DB.all('invoices').filter((i) => i.soNo === so.no);
      return Calc.terms(so).map((t) => {
        const inv = invs.filter((i) => i.term === t.no).sort((x, y) => (y.rev || 0) - (x.rev || 0))[0];
        let state = 'none';
        if (inv) {
          const x = Calc.inv(inv);
          state = inv.status !== 'Terkirim' ? 'process' : Calc.paid(x, x.total) >= x.total ? 'paid' : 'sent';
        }
        return Object.assign({}, t, { state });
      });
    }

    const rows = DB.all('salesOrders').map((so) => {
      const t = Calc.soTotals(so); const b = Calc.soBilling(so);
      const late = Cal.workdaysBetween(so.approvedDate, so.receivedDate) > Cal.slaDays('kirimDokumen');
      const terms = termStates(so);
      return Object.assign({}, so, {
        clientName: DB.client(so.clientCode).name, bdName: DB.bd(so.bdId).name, total: t.total,
        billing: b.status, billed: b.billed, late, terms,
        billedPct: t.total ? Math.round((b.billed / t.total) * 100) : 0,
        // Satu status yang dibaca user: status SO bila belum/tidak aktif, selain itu status penagihan.
        mainStatus: so.status === 'Aktif' ? b.status : so.status,
      });
    }).sort((a, b) => b.no.localeCompare(a.no));

    const active = rows.filter((r) => r.status === 'Aktif');
    const unbilled = Calc.sum(active, (r) => r.total - r.billed);
    const lateCount = rows.filter((r) => r.late).length;
    document.getElementById('kpi').innerHTML = [
      View.kpi('SO aktif', active.length, `Nilai kontrak ${money(Calc.sum(active, (r) => r.total), 'font-medium text-slate-700')}`),
      View.kpi('Sudah ditagih', money(Calc.sum(rows, (r) => r.billed)), 'Dari invoice yang sudah terkirim'),
      View.kpi('Belum ditagih', money(unbilled), 'Sisa nilai kontrak SO aktif'),
      View.kpi('Dokumen terlambat', lateCount, 'Diterima dari BD lewat H+1 hari kerja', { badge: lateCount ? View.delta('Perlu dicek', 'yellow') : '' }),
    ].join('');

    function progress(r) {
      if (r.status === 'Menunggu Approval') return '<p class="text-sm text-slate-400">Menunggu approval SO</p>';
      const done = r.terms.filter((t) => t.state === 'sent' || t.state === 'paid').length;
      const bar = r.terms.map((t, i) => `<span class="h-2 ${TERM[t.state].cls} ${i === 0 ? 'rounded-l-full' : ''} ${i === r.terms.length - 1 ? 'rounded-r-full' : ''}" style="width:${t.pct}%" title="Termin ${i + 1} (${t.pct}%) · ${TERM[t.state].label}"></span>`).join('');
      return `<div class="w-full max-w-[240px]">
        <div class="flex gap-0.5" role="img" aria-label="${done} dari ${r.terms.length} termin ditagih">${bar}</div>
        <p class="mt-1.5 flex justify-between gap-3 text-xs text-slate-500"><span>${done} dari ${r.terms.length} termin ditagih</span><span class="num font-medium text-slate-700">${r.billedPct}%</span></p>
      </div>`;
    }

    const legend = Object.values(TERM).map((t) => `<span class="inline-flex items-center gap-1.5"><span class="h-2 w-2 rounded-full ${t.cls}"></span>${t.label}</span>`).join('');

    new UI.DataTable(document.getElementById('table'), {
      data: rows, pageSize: 10, searchPlaceholder: 'Cari client, proyek, no. SO…', searchKeys: ['no', 'clientName', 'project', 'clientDocNo', 'bdName'],
      filters: [{ key: 'mainStatus', label: 'Status', options: ['Belum ditagih', 'Dalam proses', 'Sebagian ditagih', 'Lunas', 'Menunggu Approval', 'Selesai'] }, { key: 'docType', label: 'Jenis dokumen', options: ['SPK', 'PO Klien', 'Kontrak Kerja'] }],
      actions: Layout.can('so', 'buat') ? `<a href="sales-order-form.html" class="btn btn-primary">${icon('plus')}Input SPK / PO / Kontrak</a>` : '',
      empty: { icon: 'fileText', title: 'Belum ada Sales Order', description: 'Sales Order yang diinput dari SPK, PO Klien, atau Kontrak Kerja akan tampil di sini.' },
      rowClass: () => 'cursor-pointer hover:bg-slate-50',
      onRender: () => {
        const foot = document.querySelector('#table [data-footer]');
        if (foot && !document.getElementById('so-legend')) foot.insertAdjacentHTML('beforebegin', `<div id="so-legend" class="flex flex-wrap gap-x-4 gap-y-1 px-5 pb-1 pt-3 text-xs text-slate-500"><span class="font-medium text-slate-600">Progres termin:</span>${legend}</div>`);
      },
      columns: [
        { key: 'clientName', label: 'Client & proyek', sortable: true, className: '!whitespace-normal min-w-[260px]', render: (r) => `
          <a href="sales-order-detail.html?no=${encodeURIComponent(r.no)}" class="so-row-link font-medium text-slate-900 hover:text-brand-blue">${esc(r.clientName)}</a>
          <p class="text-sm text-slate-600">${esc(r.project)}${r.kwp ? ` · ${r.kwp} kWp` : ''}</p>
          <p class="mt-0.5 font-mono text-xs text-slate-400">${esc(r.no)}</p>` },
        { key: 'receivedDate', label: 'Diterima', sortable: true, render: (r) => `
          <p class="text-sm text-slate-700">${esc(r.bdName)}</p>
          <p class="text-xs ${r.late ? 'font-medium text-[#9A6400]' : 'text-slate-500'} num">${r.late ? `${icon('alert', 'w-3 h-3 inline -mt-0.5')} Terlambat · ` : ''}${UI.formatDate(r.receivedDate)}</p>` },
        { key: 'total', label: 'Nilai kontrak', align: 'right', sortable: true, render: (r) => money(r.total, 'text-base font-medium text-slate-900') },
        { key: 'billedPct', label: 'Progres penagihan', sortable: true, className: 'min-w-[220px]', render: progress },
        { key: 'mainStatus', label: 'Status', render: (r) => UI.badge(r.mainStatus) },
        { key: 'go', label: '', className: 'w-8', render: () => `<span class="text-slate-300">${icon('chevronRight', 'w-4 h-4')}</span>` },
      ],
    });

    // Seluruh baris bisa diklik untuk membuka detail SO.
    document.getElementById('table').addEventListener('click', (e) => {
      if (e.target.closest('a, button, input, select')) return;
      const link = e.target.closest('tr')?.querySelector('.so-row-link');
      if (link) window.location.href = link.href;
    });
  </script>
</body>
</html>
