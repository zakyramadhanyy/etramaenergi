<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · ETrama Finance</title>
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">
  <!-- Dashboard Finance per level: Staff = tugas & SLA; Lead = review layer 1 + verifikasi piutang; Manager = review layer 2 + eskalasi;
       Direktur = approval threshold + ringkasan penjualan & piutang. -->
  <main id="page-content" class="space-y-6">
    <div id="kpi" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-4"></div>
    <div class="grid gap-5 xl:grid-cols-[minmax(0,1fr)_400px]">
      <section aria-labelledby="task-title" class="min-w-0">
        <div class="sect-head"><div><h2 id="task-title" class="card-title"></h2><p id="task-sub" class="card-sub"></p></div><span id="task-count"></span></div>
        <ul id="tasks" class="list-flat mt-3 divide-y divide-line"></ul>
        <div id="tasks-foot" class="flex items-center justify-between gap-3 border-t border-line pt-4 text-sm text-slate-500"></div>
      </section>
      <div class="space-y-5 self-start">
        <section class="card" aria-labelledby="aging-title">
          <div class="card-head"><h2 id="aging-title" class="card-title">Umur piutang</h2><a href="piutang.html" class="btn btn-secondary btn-sm">Detail</a></div>
          <div class="card-body space-y-5"><div id="aging-bar" class="flex h-2 gap-1" role="img"></div><ul id="aging" class="space-y-3 text-sm"></ul></div>
        </section>
        <section class="card" aria-labelledby="prob-title">
          <div class="card-head"><div><h2 id="prob-title" class="card-title">Piutang bermasalah</h2><p class="card-sub">Overdue · On Hold · Dieskalasi</p></div></div>
          <ul id="prob" class="divide-y divide-slate-200 border-t border-slate-200"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/domain.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const chipDate = `<span class="inline-flex items-center gap-1.5 rounded-full border border-line bg-white px-2.5 py-0.5 text-xs font-medium text-slate-600">${UI.icon('calendar', 'w-3.5 h-3.5')}Per <span class="num">02/11/2026</span></span>`;
    const ctx = Layout.init({
      meta: (c) => `<span class="inline-flex items-center rounded-full bg-brand-soft px-2.5 py-0.5 text-xs font-bold text-brand-blue">${MOCK.roles[c.user.role].label}</span>` + chipDate,
      portal: 'finance', active: 'dashboard', title: 'Dashboard', breadcrumb: ['Finance', 'Dashboard'], greeting: true,
      actions: (c) => (c.perms.so === 'buat'
        ? `<a href="bast.html" class="btn btn-secondary">${UI.icon('clipboard')}Upload BAST</a><a href="sales-order-form.html" class="btn btn-primary">${UI.icon('plus')}Input Sales Order</a>`
        : c.perms.approval ? `<a href="approval.html" class="btn btn-primary">${UI.icon('badgeCheck')}Buka Approval</a>` : `<a href="report-piutang.html" class="btn btn-secondary">${UI.icon('chart')}Laporan Piutang</a>`),
    });
    const { esc, formatRupiah: rp } = UI;
    const role = ctx.user.role;

    const recv = Calc.receivables();
    const open = recv.filter((x) => x.arStatus !== 'Paid');
    const sumOut = (arr) => Calc.sum(arr, (x) => x.outstanding);
    const overdue = open.filter((x) => x.overdue > 0);
    const invs = DB.all('invoices').map(Calc.inv);
    const myStatus = Flow.myReviewStatus(role);
    const myQueue = myStatus ? invs.filter((x) => x.status === myStatus) : [];
    const sos = DB.all('salesOrders');
    const yearSo = sos.filter((s) => s.approvedDate.startsWith('2026') && s.status !== 'Menunggu Approval');

    /* ---------- Tugas ---------- */
    const tasks = [];
    const addInvTask = (x, title) => { const s = Calc.invoiceSla(x); tasks.push({ title, doc: x.label, sub: `${x.client.name} · Termin ${x.term.no} · ${rp(x.total)}`, href: `finance/invoice-detail.html?no=${encodeURIComponent(x.no)}`, rem: s ? s.remaining : 99, sla: s ? UI.slaBadge(s.remaining, { label: s.label }) : '' }); };
    if (role === 'staf') {
      Calc.pendingTerms().forEach((t) => tasks.push({ title: `Buat invoice termin ${t.no} (${t.label})`, doc: t.so.no, sub: `${DB.client(t.so.clientCode).name} · ${rp(t.amount)}`, href: `finance/sales-order-detail.html?no=${encodeURIComponent(t.so.no)}`, rem: t.sla.remaining, sla: UI.slaBadge(t.sla.remaining, { label: 'Buat invoice' }) }));
      invs.filter((x) => x.status === 'Dikembalikan').forEach((x) => addInvTask(x, 'Perbaiki invoice yang dikembalikan'));
      invs.filter((x) => x.status === 'Draft').forEach((x) => addInvTask(x, 'Lengkapi & ajukan draft invoice'));
      invs.filter((x) => x.status === 'Disetujui').forEach((x) => addInvTask(x, 'Kirim invoice + form transmittal'));
      open.forEach((x) => { const r = Calc.reminderDue(x); if (r) tasks.push({ title: `Reminder ${r} jatuh tempo ${UI.formatDate(x.due)}`, doc: x.no, sub: `${x.clientName} · ${rp(x.outstanding)}`, href: `finance/piutang-detail.html?no=${encodeURIComponent(x.no)}`, rem: 0, sla: UI.badge('Hari ini', { tone: 'yellow', icon: 'bell' }) }); });
      overdue.filter((x) => x.arStatus === 'Overdue').forEach((x) => tasks.push({ title: 'Pemberitahuan ulang piutang overdue', doc: x.no, sub: `${x.clientName} · lewat ${x.overdue} hari · ${rp(x.outstanding)}`, href: `finance/piutang-detail.html?no=${encodeURIComponent(x.no)}`, rem: -1, sla: UI.badge('Overdue', {}) }));
    } else if (myStatus) {
      myQueue.forEach((x) => addInvTask(x, Flow.isOwn(x, ctx.user) ? 'Dokumen Anda sendiri — tidak dapat Anda approve' : `Review invoice (${myStatus.replace('Review ', '')})`));
    }
    if (role === 'lead') recv.filter((x) => (x.ar.payments || []).length && !x.ar.checked).forEach((x) => tasks.push({ title: 'Verifikasi pembaruan laporan piutang', doc: x.no, sub: `${x.clientName} · dibayar ${rp(x.paid)}`, href: `finance/piutang-detail.html?no=${encodeURIComponent(x.no)}`, rem: 1, sla: UI.badge('Belum dicek') }));
    if (['lead', 'mgr_ops', 'direktur'].includes(role)) open.filter((x) => x.arStatus === 'Dieskalasi' && !x.ar.decision).forEach((x) => tasks.push({ title: role === 'mgr_ops' ? 'Piutang dieskalasi ke Manager (pantau)' : 'Putuskan tindakan piutang bermasalah', doc: x.no, sub: `${x.clientName} · lewat ${x.overdue} hari · ${rp(x.outstanding)}`, href: `finance/piutang-detail.html?no=${encodeURIComponent(x.no)}`, rem: -2, sla: UI.badge('Dieskalasi') }));
    tasks.sort((a, b) => a.rem - b.rem);
    const titles = { staf: ['Tugas saya', 'Diurutkan dari SLA paling mendesak'], lead: ['Tugas menunggu persetujuan saya', 'Review layer 1, verifikasi piutang, keputusan piutang bermasalah'], mgr_ops: ['Tugas menunggu persetujuan saya', 'Review layer 2 (SLA H+1) dan eskalasi piutang'], direktur: ['Tugas menunggu persetujuan saya', 'Approval di atas threshold & piutang bermasalah'] };
    document.getElementById('task-title').textContent = titles[role][0];
    document.getElementById('task-sub').textContent = titles[role][1];
    document.getElementById('task-count').innerHTML = tasks.length ? UI.badge(`${tasks.length} item`, { tone: 'blue', icon: 'inbox' }) : '';
    let showAll = false;
    function renderTasks() {
      const list = showAll ? tasks : tasks.slice(0, 6);
      document.getElementById('tasks').innerHTML = list.length ? list.map((t) => {
        const m = String(t.sub).match(/Rp [\d.]+/); const amt = m ? m[0] : '';
        const sub = String(t.sub).replace(/ ?· ?Rp [\d.]+/, '').replace(/^Rp [\d.]+ ?· ?/, '');
        return `<li><a href="${Layout.url(t.href)}" class="flex flex-wrap items-start justify-between gap-x-6 gap-y-1 py-4 hover:bg-slate-50">
          <span class="min-w-0 flex-1"><span class="block text-base font-semibold text-slate-900">${esc(t.title)}</span><span class="mt-1 block truncate text-sm text-slate-500"><span class="font-mono">${esc(t.doc)}</span> · ${esc(sub)}</span></span>
          <span class="flex flex-col items-end gap-1">${amt ? `<span class="text-base font-bold text-slate-900 num">${amt}</span>` : ''}${t.sla}</span></a></li>`;
      }).join('') : `<li>${UI.emptyState({ icon: 'checkCircle', title: 'Tidak ada tugas tertunda', description: 'Semua dokumen sudah diproses sesuai SLA.' })}</li>`;
      document.getElementById('tasks-foot').innerHTML = tasks.length > 6
        ? `<span>Menampilkan ${list.length} dari ${tasks.length} tugas</span><button type="button" id="tasks-more" class="font-semibold text-brand-blue hover:underline">${showAll ? 'Ringkas' : 'Lihat semua tugas →'}</button>` : '';
      const mb = document.getElementById('tasks-more'); if (mb) mb.addEventListener('click', () => { showAll = !showAll; renderTasks(); });
    }
    renderTasks();

    /* ---------- KPI per role ---------- */
    const late = tasks.filter((t) => t.rem < 0).length;
    const k = {
      staf: [
        View.kpi('Tugas lewat SLA', late, `${tasks.length} tugas total`, { badge: late ? View.delta('Perlu tindakan', 'red') : View.delta('Aman', 'green') }),
        View.kpi('Invoice perlu tindakan', invs.filter((x) => ['Draft', 'Dikembalikan', 'Disetujui'].includes(x.status)).length, 'Draft · dikembalikan · siap kirim', { icon: 'receipt', href: 'finance/invoice-list.html' }),
        View.kpi('Dalam review', invs.filter((x) => /^Review/.test(x.status)).length, 'Menunggu Lead / Manager / Direktur', { icon: 'eye', href: 'finance/invoice-list.html' }),
        View.kpi('Piutang overdue', rp(sumOut(overdue)), `${overdue.length} invoice lewat jatuh tempo`, { href: 'finance/piutang.html', badge: View.delta(`${Math.round((sumOut(overdue) / (sumOut(open) || 1)) * 100)}%`, 'red') }),
      ],
      lead: [
        View.kpi('Menunggu review saya', myQueue.length, `${myQueue.filter((x) => (Calc.invoiceSla(x) || {}).remaining < 0).length} lewat SLA`, { icon: 'badgeCheck', href: 'finance/approval.html' }),
        View.kpi('Total piutang', rp(sumOut(open)), `${open.length} invoice terbuka`, { icon: 'coins', href: 'finance/piutang.html' }),
        View.kpi('Piutang overdue', rp(sumOut(overdue)), `${overdue.length} invoice`, { icon: 'alert', iconCls: 'text-red-600', href: 'finance/piutang.html' }),
        View.kpi('Belum dicek', recv.filter((x) => (x.ar.payments || []).length && !x.ar.checked).length, 'Pembaruan laporan piutang', { icon: 'checkCheck' }),
      ],
      mgr_ops: [
        View.kpi('Menunggu review saya', myQueue.length, 'Layer 2 · SLA H+1', { icon: 'badgeCheck', href: 'finance/approval.html' }),
        View.kpi('Invoice disetujui (bulan ini)', invs.filter((x) => x.history.some((h) => /Manager/.test(h.action) && h.at.startsWith('2026-1'))).length, 'Oktober–November 2026', { icon: 'checkCircle' }),
        View.kpi('Piutang dieskalasi', open.filter((x) => x.arStatus === 'Dieskalasi').length, rp(sumOut(open.filter((x) => x.arStatus === 'Dieskalasi'))), { icon: 'arrowUp', iconCls: 'text-orange-600', href: 'finance/piutang.html' }),
        View.kpi('Piutang overdue', rp(sumOut(overdue)), `${overdue.length} invoice`, { icon: 'alert', iconCls: 'text-red-600', href: 'finance/piutang.html' }),
      ],
      direktur: [
        View.kpi('Menunggu approval Direktur', myQueue.length, `Di atas ${rp(Flow.config().threshold.tiers[0].min)}`, { icon: 'badgeCheck', href: 'finance/approval.html' }),
        View.kpi('Nilai SO 2026', rp(Calc.sum(yearSo, (s) => Calc.soTotals(s).total)), `${yearSo.length} SO`, { icon: 'chart', href: 'finance/report-sales-order.html' }),
        View.kpi('Total piutang', rp(sumOut(open)), `${open.length} invoice terbuka`, { icon: 'coins', href: 'finance/report-piutang.html' }),
        View.kpi('Piutang > 30 hari', rp(sumOut(open.filter((x) => x.overdue > 30))), 'Termasuk dieskalasi', { icon: 'alert', iconCls: 'text-red-600', href: 'finance/report-piutang.html' }),
      ],
    };
    document.getElementById('kpi').innerHTML = k[role].join('');

    /* ---------- Aging ---------- */
    const colors = ['bg-slate-400', 'bg-amber-400', 'bg-orange-500', 'bg-red-500', 'bg-red-800'];
    const totalOpen = sumOut(open) || 1;
    const per = Calc.BUCKETS.map((b) => sumOut(open.filter((x) => x.bucket === b)));
    document.getElementById('aging-bar').setAttribute('aria-label', 'Proporsi piutang per umur');
    document.getElementById('aging-bar').innerHTML = per.map((v, i) => (v ? `<span class="${colors[i]} rounded-full" style="width:${(v / totalOpen) * 100}%"></span>` : '')).join('');
    document.getElementById('aging').innerHTML = Calc.BUCKETS.map((b, i) => `<li class="flex items-center gap-2.5"><span class="h-2 w-2 rounded-full ${colors[i]}"></span><span class="flex-1 text-slate-600">${b}</span><span class="w-10 text-right text-slate-500 num">${Math.round((per[i] / totalOpen) * 100)}%</span><span class="w-36 text-right font-semibold text-slate-900 num">${rp(per[i])}</span></li>`).join('')
      + `<li class="flex items-center justify-between border-t border-slate-200 pt-3 font-bold"><span>Total</span><span class="num">${rp(sumOut(open))}</span></li>`;

    const prob = open.filter((x) => ['Overdue', 'On Hold', 'Dieskalasi'].includes(x.arStatus) || (x.arStatus === 'Partially Paid' && x.overdue > 0)).sort((a, b) => b.overdue - a.overdue);
    document.getElementById('prob').innerHTML = prob.length ? prob.slice(0, 6).map((x) => `<li><a href="${Layout.url('finance/piutang-detail.html?no=' + encodeURIComponent(x.no))}" class="flex items-center gap-3 px-6 py-4 hover:bg-slate-50">
      <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold text-slate-900">${esc(x.clientName)}</span><span class="mt-0.5 block truncate text-xs text-slate-500"><span class="font-mono">${esc(x.no)}</span> · lewat ${x.overdue} hari</span></span>
      <span class="flex flex-col items-end gap-1.5"><span class="text-sm font-bold num">${rp(x.outstanding)}</span>${UI.badge(x.arStatus)}</span></a></li>`).join('')
      : `<li>${UI.emptyState({ icon: 'checkCircle', title: 'Tidak ada piutang bermasalah' })}</li>`;
  </script>
</body>
</html>
