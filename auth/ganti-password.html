<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganti Password · ETrama</title>
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="font-sans text-slate-900">
  <!-- ASUMSI: jika halaman dibuka tanpa session login pertama, prototipe memakai akun demo Fajar Nugroho (password sementara). -->
  <main id="auth-content" class="w-full max-w-[400px]">
    <p class="mb-4 inline-flex items-center gap-1.5 rounded-md bg-amber-50 px-2 py-1 text-xs font-semibold text-amber-900 ring-1 ring-inset ring-amber-300"><span data-icon="lock" data-size="w-3.5 h-3.5"></span>Wajib sebelum melanjutkan</p>
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Ganti password sementara</h1>
    <p class="mt-1.5 text-sm leading-relaxed text-slate-600">Halo <span id="acc-name" class="font-semibold text-slate-900"></span>, ini login pertama Anda. Demi keamanan, ganti password sementara yang dikirim ke <span id="acc-email" class="font-medium text-slate-800"></span> sebelum memakai sistem.</p>

    <form id="change-form" class="mt-6 space-y-5" novalidate>
        <input type="email" id="username" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true">
      <div data-field>
        <label for="current" class="block text-sm font-medium text-slate-800">Password sementara</label>
        <div class="relative mt-1.5">
          <input id="current" type="password" autocomplete="current-password" required
            class="block h-11 w-full rounded-lg border-slate-300 pl-3.5 pr-11 text-sm focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20">
          <button type="button" data-toggle-password="current" class="absolute inset-y-0 right-0 grid w-11 place-items-center rounded-r-lg text-slate-500 hover:text-slate-800"></button>
        </div>
      </div>
      <div data-field>
        <label for="pw" class="block text-sm font-medium text-slate-800">Password baru</label>
        <div class="relative mt-1.5">
          <input id="pw" type="password" autocomplete="new-password" required aria-describedby="pw-rules"
            class="block h-11 w-full rounded-lg border-slate-300 pl-3.5 pr-11 text-sm focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20">
          <button type="button" data-toggle-password="pw" class="absolute inset-y-0 right-0 grid w-11 place-items-center rounded-r-lg text-slate-500 hover:text-slate-800"></button>
        </div>
        <ul id="pw-rules" class="mt-2.5 space-y-1 text-xs" aria-live="polite"></ul>
      </div>
      <div data-field>
        <label for="pw2" class="block text-sm font-medium text-slate-800">Konfirmasi password baru</label>
        <div class="relative mt-1.5">
          <input id="pw2" type="password" autocomplete="new-password" required
            class="block h-11 w-full rounded-lg border-slate-300 pl-3.5 pr-11 text-sm focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20">
          <button type="button" data-toggle-password="pw2" class="absolute inset-y-0 right-0 grid w-11 place-items-center rounded-r-lg text-slate-500 hover:text-slate-800"></button>
        </div>
      </div>
      <button id="submit" type="submit" class="flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand-navy text-sm font-semibold text-white hover:bg-brand-navy-hover disabled:opacity-70">Simpan dan lanjutkan</button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">Bukan akun Anda? <button type="button" id="logout" class="rounded font-semibold text-brand-blue hover:underline">Keluar</button></p>
  </main>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/domain.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    Layout.initAuth();
    document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = UI.icon(el.dataset.icon, el.dataset.size); });

    let user = Auth.sessionUser();
    // Sudah login dengan password tetap → halaman ini tidak diperlukan.
    if (user && !Auth.needsPasswordChange(user)) window.location.replace(Auth.homeFor(user));
    if (!user) user = Auth.byId('U-003');
    document.getElementById('acc-name').textContent = user.name.split(' ')[0];
    document.getElementById('acc-email').textContent = user.email;
    document.getElementById('username').value = user.email;

    const current = document.getElementById('current');
    const pw = document.getElementById('pw');
    const pw2 = document.getElementById('pw2');
    const rules = document.getElementById('pw-rules');
    UI.renderPasswordRules(rules, '');
    pw.addEventListener('input', () => { UI.renderPasswordRules(rules, pw.value); UI.fieldError(pw, ''); });
    [current, pw2].forEach((i) => i.addEventListener('input', () => UI.fieldError(i, '')));

    document.getElementById('change-form').addEventListener('submit', (e) => {
      e.preventDefault();
      [current, pw, pw2].forEach((i) => UI.fieldError(i, ''));
      let ok = true;
      if (!current.value) { UI.fieldError(current, 'Password sementara wajib diisi'); ok = false; }
      else if (current.value !== user.tempPassword) { UI.fieldError(current, 'Password sementara salah'); ok = false; }
      if (!pw.value) { UI.fieldError(pw, 'Password baru wajib diisi'); ok = false; }
      else if (!UI.passwordRules(pw.value).every((r) => r.ok)) { UI.fieldError(pw, 'Password belum memenuhi semua ketentuan'); ok = false; }
      else if (pw.value === user.tempPassword) { UI.fieldError(pw, 'Password baru tidak boleh sama dengan password sementara'); ok = false; }
      if (!pw2.value) { UI.fieldError(pw2, 'Konfirmasi password wajib diisi'); ok = false; }
      else if (pw.value && pw2.value !== pw.value) { UI.fieldError(pw2, 'Konfirmasi password tidak sama'); ok = false; }
      if (!ok) { document.querySelector('[aria-invalid="true"]').focus(); return; }

      Auth.setPassword(user.id, pw.value);
      Auth.login(user);
      window.location.href = Auth.homeFor(user);
    });

    document.getElementById('logout').addEventListener('click', () => {
      Auth.logout();
      window.location.href = 'login.html?logout=1';
    });
  </script>
</body>
</html>
